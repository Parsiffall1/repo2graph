  #hud {

aph/cache.py", "kind": "class", "lang": "python", "start_line": 94, "end_line": 200, "sig": "class ResultCache:", "doc": "A thread-safe LRU cache with per-entry expiry. Args: max_size: Entries kept before the least recently used is evicted. 0 or less disables the cache entirely, which stays a valid configuration rather than an error. ttl: Seconds an entry may be served for. clock: Monotonic time source, injected so tests can advance it without sleeping."}, {"id": "sym:repo2graph/cache.py::ResultCache.get", "label": "ResultCache.get", "type": "symbol", "deg": 73, "path": "repo2graph/cache.py", "kind": "function", "lang": "python", "start_line": 123, "end_line": 151, "sig": "def get(self, key: str) -> Any:", "doc": "Return the cached value for `key`, or None when there is none. An expired entry is dropped and counted as a miss, so a caller cannot tell \"expired\" from \"never seen\" -- which is the point. Args: key: A key from `make_key`. Returns: The cached value, or None."}, {"id": "sym:repo2graph/cache.py::ResultCache.put", "label": "ResultCache.put", "type": "symbol", "deg": 8, "path": "repo2graph/cache.py", "kind": "function", "lang": "python", "start_line": 153, "end_line": 163, "sig": "def put(self, key: str, value: Any) -> None:", "doc": "Store `value` under `key`, evicting the oldest entry if needed."}, {"id": "sym:repo2graph/cache.py::ResultCache.clear", "label": "ResultCache.cl…", "type": "symbol", "deg": 11, "path": "repo2graph/cache.py", "kind": "function", "lang": "python", "start_line": 165, "end_line": 178, "sig": "def clear(self) -> int:", "doc": "Drop every entry. Called whenever the index is rebuilt. Counters are deliberately *not* reset: they describe the life of the process, and zeroing them on every rebuild would hide exactly the churn an operator is looking at them to find. Returns: How many entries were dropped."}, {"id": "sym:repo2graph/cache.py::ResultCache.stats", "label": "ResultCache.st…", "type": "symbol", "deg": 5, "path": "repo2graph/cache.py", "kind": "function", "lang": "python", "start_line": 180, "end_line": 200, "sig": "def stats(self) -> dict[str, Any]:", "doc": "Counters for the `repo_cache_stats` tool. Returns: hits, misses, size, max_size and ttl_s, plus eviction and hit-rate figures an operator needs to tell a working cache from a thrashing one. A cache at max_size with a hit rate near zero is sized wrong, and neither number says that alone."}, {"id": "module:collections", "label": "collections", "type": "module", "deg": 7}, {"id": "file:repo2graph/chunks.py", "label": "chunks.py", "type": "file", "deg": 26, "path": "repo2graph/chunks.py", "lang": "python", "lines": 207}, {"id": "sym:repo2graph/chunks.py::build_chunks", "label": "build_chunks", "type": "symbol", "deg": 3, "path": "repo2graph/chunks.py", "kind": "function", "lang": "python", "start_line": 64, "end_line": 66, "sig": "def build_chunks(g, include_files: bool = True) -> list[dict]:", "doc": "All retrieval chunks as a list (stable public API)."}, {"id": "sym:repo2graph/chunks.py::iter_chunks", "label": "iter_chunks", "type": "symbol", "deg": 16, "path": "repo2graph/chunks.py", "kind": "function", "lang": "python", "start_line": 69, "end_line": 206, "sig": "def iter_chunks(g, include_files: bool = True):", "doc": "Yield chunk dicts ready for embedding, one at a time. A generator, not a list: on a large repo the chunk text is the single biggest allocation, so write_jsonl streams it straight to disk instead of holding every chunk in memory at once. Source text is dropped from the cache as soon as the last symbol on a file has been emitted."}, {"id": "file:repo2graph/cli.py", "label": "cli.py", "type": "file", "deg": 50, "path": "repo2graph/cli.py", "lang": "python", "lines": 620}, {"id": "sym:repo2graph/cli.py::_emit", "label": "_emit", "type": "symbol", "deg": 13, "path": "repo2graph/cli.py", "kind": "function", "lang": "python", "start_line": 38, "end_line": 69, "sig": "def _emit(text: str) -> None:", "doc": "The single stdout write for the whole CLI. Cannot raise on encoding. A redirected or piped Windows stdout is a strict cp1252 TextIOWrapper, so `repo2graph rag \"...\" > pack.md` over any repository holding a single non-ASCII source byte would otherwise die with 'charmap' codec errors. Git Bash is worse: it hands a piped stdout `errors='surrogateescape'`, which still raises on any character cp1252 l…"}, {"id": "sym:repo2graph/cli.py::cmd_build", "label": "cmd_build", "type": "symbol", "deg": 10, "path": "repo2graph/cli.py", "kind": "function", "lang": "python", "start_line": 72, "end_line": 91, "sig": "def cmd_build(args):"}, {"id": "sym:repo2graph/cli.py::_require_index", "label": "_require_index", "type": "symbol", "deg": 5, "path": "repo2graph/cli.py", "kind": "function", "lang": "python", "start_line": 106, "end_line": 125, "sig": "def _require_index(out: Path, name: str) -> Path:"}, {"id": "sym:repo2graph/cli.py::cmd_embed", "label": "cmd_embed", "type": "symbol", "deg": 16, "path": "repo2graph/cli.py", "kind": "function", "lang": "python", "start_line": 164, "end_line": 208, "sig": "def cmd_embed(args):", "doc": "Embed an index's chunks, reusing every vector whose text is unchanged."}, {"id": "sym:repo2graph/cli.py::cmd_query", "label": "cmd_query", "type": "symbol", "deg": 7, "path": "repo2graph/cli.py", "kind": "function", "lang": "python", "start_line": 232, "end_line": 252, "sig": "def cmd_query(args):"}, {"id": "sym:repo2graph/cli.py::_rag_index_dir", "label": "_rag_index_dir", "type": "symbol", "deg": 10, "path": "repo2graph/cli.py", "kind": "function", "lang": "python", "start_line": 261, "end_line": 280, "sig": "def _rag_index_dir(args) -> Path:", "doc": "Resolve the `rag` target to an index directory, building it if needed."}, {"id": "sym:repo2graph/cli.py::verify_rag", "label": "verify_rag", "type": "symbol", "deg": 7, "path": "repo2graph/cli.py", "kind": "function", "lang": "python", "start_line": 283, "end_line": 347, "sig": "def verify_rag(idx, out, embed_model=None) -> tuple[dict, str | None]:", "doc": "Self-test the dense-retrieval path against one index. Answers the four questions that distinguish \"dense retrieval is working\" from \"dense retrieval silently is not\": are there vectors at all, which model and width were they built with, does the active embedder agree, and does every chunk actually have one. Args: idx: An open `Index`. out: The index directory, for error messages. embed_model: Mod…"}, {"id": "sym:repo2graph/cli.py::cmd_rag", "label": "cmd_rag", "type": "symbol", "deg": 8, "path": "repo2graph/cli.py", "kind": "function", "lang": "python", "start_line": 371, "end_line": 395, "sig": "def cmd_rag(args):", "doc": "Pack an agent-ready, citation-carrying context for one question."}, {"id": "sym:repo2graph/cli.py::main", "label": "main", "type": "symbol", "deg": 6, "path": "repo2graph/cli.py", "kind": "function", "lang": "python", "start_line": 482, "end_line": 615, "sig": "def main(argv=None):"}, {"id": "module:pathlib", "label": "pathlib", "type": "module", "deg": 20}, {"id": "file:repo2graph/embed.py", "label": "embed.py", "type": "file", "deg": 12, "path": "repo2graph/embed.py", "lang": "python", "lines": 269}, {"id": "sym:repo2graph/embed.py::Embedder.encode", "label": "Embedder.encode", "type": "symbol", "deg": 24, "path": "repo2graph/embed.py", "kind": "function", "lang": "python", "start_line": 44, "end_line": 45, "sig": "def encode(self, texts: list[str]) -> list[list[float]]:"}, {"id": "sym:repo2graph/embed.py::_npy_read", "label": "_npy_read", "type": "symbol", "deg": 13, "path": "repo2graph/embed.py", "kind": "function", "lang": "python", "start_line": 72, "end_line": 115, "sig": "def _npy_read(path: Path) -> tuple[list, int]:", "doc": "Read a 2-D C-order '\u003cf4' NPY file; returns (rows, cols). Anything else -- a different dtype, Fortran order, a truncated header or a short payload -- is a ValueError, which load_vectors turns into \"no vectors\" rather than an exception in the middle of a query."}, {"id": "sym:repo2graph/embed.py::text_hash", "label": "text_hash", "type": "symbol", "deg": 8, "path": "repo2graph/embed.py", "kind": "function", "lang": "python", "start_line": 126, "end_line": 130, "sig": "def text_hash(chunk) -> str:", "doc": "sha256 of a chunk's text. A chunk's vector depends on nothing else, so this is a sound reuse key even when the surrounding graph changed."}, {"id": "sym:repo2graph/embed.py::build_vectors", "label": "build_vectors", "type": "symbol", "deg": 11, "path": "repo2graph/embed.py", "kind": "function", "lang": "python", "start_line": 153, "end_line": 181, "sig": "def build_vectors(chunks, embedder, batch: int = DEFAULT_BATCH, reuse=None) -> dict[str, list[float]]:", "doc": "{chunk id: vector} for every chunk, embedding in batches. `reuse` is an optional {chunk id: vector} of vectors already known to be current (see cli.cmd_embed); those chunks are never handed to the embedder."}, {"id": "sym:repo2graph/embed.py::write_vectors", "label": "write_vectors", "type": "symbol", "deg": 8, "path": "repo2graph/embed.py", "kind": "function", "lang": "python", "start_line": 184, "end_line": 214, "sig": "def write_vectors(path, vectors, model_id: str, dim: int, chunk_ids, text_hashes=None) -> int:", "doc": "Write vectors.npy plus its sibling vectors.meta.json; return the count. Row order is `chunk_ids` order, which is chunks.jsonl order, so re-running `embed` over an unchanged index reproduces the file byte for byte."}, {"id": "sym:repo2graph/embed.py::load_vectors", "label": "load_vectors", "type": "symbol", "deg": 9, "path": "repo2graph/embed.py", "kind": "function", "lang": "python", "start_line": 217, "end_line": 238, "sig": "def load_vectors(path) -> tuple[dict[str, list[float]], dict]:", "doc": "Inverse of write_vectors: ({chunk id: vector}, meta). Raises ValueError/OSError on anything malformed; callers that must not fail (query.Index) catch both and fall back to BM25."}, {"id": "sym:repo2graph/embed.py::_SentenceTransformerEmbedder.encode", "label": "_SentenceTrans…", "type": "symbol", "deg": 27, "path": "repo2graph/embed.py", "kind": "function", "lang": "python", "start_line": 250, "end_line": 252, "sig": "def encode(self, texts):"}, {"id": "file:repo2graph/events.py", "label": "events.py", "type": "file", "deg": 13, "path": "repo2graph/events.py", "lang": "python", "lines": 145}, {"id": "sym:repo2graph/events.py::encodable", "label": "encodable", "type": "symbol", "deg": 9, "path": "repo2graph/events.py", "kind": "function", "lang": "python", "start_line": 34, "end_line": 75, "sig": "def encodable(text: str, stream: Any) -> str:", "doc": "Return `text` reduced to something `stream` is guaranteed to accept. The stream's encoding and error handler are read at call time, not at import time: tests replace `sys.stdout` after import, and a caller may reconfigure it mid-run. Args: text: The text about to be written. stream: The destination stream, inspected for `.encoding`/`.errors`. Returns: `text` unchanged when the stream can represen…"}, {"id": "sym:repo2graph/events.py::write_safe", "label": "write_safe", "type": "symbol", "deg": 10, "path": "repo2graph/events.py", "kind": "function", "lang": "python", "start_line": 78, "end_line": 105, "sig": "def write_safe(stream: Any, text: str, newline: str = \"\\n\") -> None:", "doc": "Write `text` to `stream`, replacing anything it cannot encode. Never raises: a UnicodeEncodeError, a closed stream or a broken pipe all end as silence rather than as an exception in the caller. Args: stream: Destination, typically `sys.stdout` or `sys.stderr`. text: The line to write, without a trailing newline. newline: Appended to `text`; pass \"\" to suppress it."}, {"id": "sym:repo2graph/events.py::emit", "label": "emit", "type": "symbol", "deg": 6, "path": "repo2graph/events.py", "kind": "function", "lang": "python", "start_line": 120, "end_line": 144, "sig": "def emit(event: str, level: str = \"warning\", stream: TextIO | None = None, **fields: Any) -> dict[str, Any]:", "doc": "Write one structured event as a single JSON line on stderr. Args: event: Machine-readable event name, e.g. `\"rag_fusion_disabled\"`. level: Severity label; \"warning\" by default. stream: Destination; defaults to `sys.stderr` resolved at call time. **fields: Additional JSON-serialisable fields merged into the record. Returns: The record that was emitted, so callers and tests can assert on it without…"}, {"id": "file:repo2graph/export.py", "label": "export.py", "type": "file", "deg": 48, "path": "repo2graph/export.py", "lang": "python", "lines": 682}, {"id": "sym:repo2graph/export.py::atomic_write", "label": "atomic_write", "type": "symbol", "deg": 12, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 19, "end_line": 38, "sig": "def atomic_write(path: Path, mode: str = \"w\", **open_kw):", "doc": "Write via a sibling temp file renamed onto `path` only on a clean exit. A crash, exception or Ctrl-C mid-write then leaves the previous artifact (or none) intact rather than a truncated file that `query`/`map` would choke on. The temp file is in the target's own directory, so os.replace is atomic."}, {"id": "sym:repo2graph/export.py::make_paths", "label": "make_paths", "type": "symbol", "deg": 3, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 85, "end_line": 89, "sig": "def make_paths(outdir, name) -> list[Path]:"}, {"id": "sym:repo2graph/export.py::_grid_pairs", "label": "_grid_pairs", "type": "symbol", "deg": 5, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 129, "end_line": 146, "sig": "def _grid_pairs(pos, cell):", "doc": "Yield the node pairs sitting within one grid cell of each other. Every pair lands in the same bucket or in two adjacent ones, and each unordered pair is yielded once: only four of the eight neighbouring cells are scanned, the other four see the pair from their own side."}, {"id": "sym:repo2graph/export.py::_layout", "label": "_layout", "type": "symbol", "deg": 7, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 224, "end_line": 252, "sig": "def _layout(g, sizes):", "doc": "Node positions in points, spread so labels do not collide."}, {"id": "sym:repo2graph/export.py::write_graphml", "label": "write_graphml", "type": "symbol", "deg": 12, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 319, "end_line": 408, "sig": "def write_graphml(g, path: Path):"}, {"id": "sym:repo2graph/export.py::write_overview", "label": "write_overview", "type": "symbol", "deg": 8, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 435, "end_line": 457, "sig": "def write_overview(g, path: Path, top: int = 25):", "doc": "Human/LLM-readable repo map: top directories, hub files, entry points."}, {"id": "sym:repo2graph/export.py::write_manifest", "label": "write_manifest", "type": "symbol", "deg": 9, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 517, "end_line": 551, "sig": "def write_manifest(g, path: Path, written: list[str]):", "doc": "Describe the agent-facing output so a reader needs no other docs."}, {"id": "sym:repo2graph/export.py::register_written", "label": "register_writt…", "type": "symbol", "deg": 11, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 557, "end_line": 585, "sig": "def register_written(outdir, names) -> bool:", "doc": "Merge `names` into an existing manifest's `written` and `files`. `embed` runs after `build` as a separate command, so it must append to the manifest dump_all already wrote rather than rewrite it: every other key -- counts, entrypoints, how_to_read -- is left exactly as it was. Returns False when there is no readable manifest to append to."}, {"id": "sym:repo2graph/export.py::load_parse_cache", "label": "load_parse_cac…", "type": "symbol", "deg": 10, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 616, "end_line": 640, "sig": "def load_parse_cache(outdir: Path) -> dict:", "doc": "Read a previous build's parse cache out of an index directory. Every failure mode -- no index, no cache file, unreadable, malformed JSON, a format bump -- returns an empty dict, which makes the next build a full one. An incremental build that silently reuses entries it does not understand is the failure this whole feature was deferred to avoid, so the only safe response to an unrecognised cache i…"}, {"id": "sym:repo2graph/export.py::dump_all", "label": "dump_all", "type": "symbol", "deg": 15, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 643, "end_line": 681, "sig": "def dump_all(g, chunks, outdir: Path, formats: set[str], viz_nodes: int = MAX_NODES):", "doc": "Write the requested artifacts. `chunks` is an iterable of chunk dicts (a build_chunks generator) or None. Returns (written_paths, chunk_count)."}, {"id": "file:repo2graph/fetch.py", "label": "fetch.py", "type": "file", "deg": 35, "path": "repo2graph/fetch.py", "lang": "python", "lines": 214}, {"id": "sym:repo2graph/fetch.py::parse_spec", "label": "parse_spec", "type": "symbol", "deg": 6, "path": "repo2graph/fetch.py", "kind": "function", "lang": "python", "start_line": 60, "end_line": 72, "sig": "def parse_spec(spec: str) -> tuple[str, str]:", "doc": "'owner/repo', a GitHub URL or an SSH remote -> (owner, repo)."}, {"id": "sym:repo2graph/fetch.py::_redact", "label": "_redact", "type": "symbol", "deg": 7, "path": "repo2graph/fetch.py", "kind": "function", "lang": "python", "start_line": 75, "end_line": 84, "sig": "def _redact(msg: str, token: str | None) -> str:", "doc": "Strip the token, its base64 'basic' form, and URL-encoded form from user-facing text (SH-3)."}, {"id": "sym:repo2graph/fetch.py::_auth_env", "label": "_auth_env", "type": "symbol", "deg": 11, "path": "repo2graph/fetch.py", "kind": "function", "lang": "python", "start_line": 87, "end_line": 113, "sig": "def _auth_env(token: str | None) -> dict:", "doc": "Environment carrying the clone credential out of band. The token must never be an argv element (ISS-16): it would be visible in `ps`/`/proc` to every other user. git reads http.extraheader from GIT_CONFIG_* for this one invocation only, so nothing lands on disk either."}, {"id": "sym:repo2graph/fetch.py::clone", "label": "clone", "type": "symbol", "deg": 12, "path": "repo2graph/fetch.py", "kind": "function", "lang": "python", "start_line": 116, "end_line": 165, "sig": "def clone(spec: str, dest: Path, ref: str | None = None, depth: int = 0, token: str | None = None) -> Path:", "doc": "Clone a GitHub repo into dest/\u003crepo>. depth=0 means full history."}, {"id": "sym:repo2graph/fetch.py::index_github", "label": "index_github", "type": "symbol", "deg": 16, "path": "repo2graph/fetch.py", "kind": "function", "lang": "python", "start_line": 178, "end_line": 213, "sig": "def index_github(spec: str, outdir: Path, ref: str | None = None, depth: int = 0, git_history: int = 0, formats: str = \"jsonl,graphml,cypher,overview,html\", include=None, exclude=None, max_files: int = 0, keep_clone: Path | None = N", "doc": "Clone a GitHub repo, build its graph, write artifacts to outdir."}, {"id": "module:subprocess", "label": "subprocess", "type": "module", "deg": 10}, {"id": "file:repo2graph/graph.py", "label": "graph.py", "type": "file", "deg": 41, "path": "repo2graph/graph.py", "lang": "python", "lines": 590}, {"id": "sym:repo2graph/graph.py::Graph", "label": "Graph", "type": "symbol", "deg": 5, "path": "repo2graph/graph.py", "kind": "class", "lang": "python", "start_line": 23, "end_line": 59, "sig": "class Graph:"}, {"id": "sym:repo2graph/graph.py::import_targets", "label": "import_targets", "type": "symbol", "deg": 6, "path": "repo2graph/graph.py", "kind": "function", "lang": "python", "start_line": 77, "end_line": 92, "sig": "def import_targets(raw: str, lang: str) -> list[str]:"}, {"id": "sym:repo2graph/graph.py::path_index", "label": "path_index", "type": "symbol", "deg": 5, "path": "repo2graph/graph.py", "kind": "function", "lang": "python", "start_line": 95, "end_line": 108, "sig": "def path_index(file_index) -> dict:", "doc": "Lookup tables so import resolution never rescans the whole file list. by_name: basename -> sorted paths. by_dir: directory -> sorted paths. Sorted so a repo with several same-named files resolves deterministically."}, {"id": "sym:repo2graph/graph.py::resolve_import", "label": "resolve_import", "type": "symbol", "deg": 15, "path": "repo2graph/graph.py", "kind": "function", "lang": "python", "start_line": 111, "end_line": 174, "sig": "def resolve_import(target: str, from_path: str, lang: str, file_index: set[str], ctx: dict | None = None) -> str | None:", "doc": "Map an import target to an in-repo file path when possible."}, {"id": "sym:repo2graph/graph.py::entry_read", "label": "entry_read", "type": "symbol", "deg": 6, "path": "repo2graph/graph.py", "kind": "function", "lang": "python", "start_line": 251, "end_line": 275, "sig": "def entry_read(entry: dict) -> tuple | None:", "doc": "Rebuild `_read_and_parse`'s result tuple from a cache entry. Args: entry: One record out of `parse.cache.json`. Returns: The `(size, lines, ParsedFile | None, digest)` tuple the build loop consumes, or None if the entry is malformed. A malformed entry is a cache miss, never an exception: a corrupt cache must cost a re-parse, not the build."}, {"id": "sym:repo2graph/graph.py::parse_incremental", "label": "parse_incremen…", "type": "symbol", "deg": 10, "path": "repo2graph/graph.py", "kind": "function", "lang": "python", "start_line": 278, "end_line": 330, "sig": "def parse_incremental(files, jobs: int, cache: dict, counts: dict):", "doc": "Read every file, but re-parse only the ones whose bytes changed. A file's `ParsedFile` is a pure function of its bytes and its language and nothing else, so reusing one for a file whose sha256 still matches is exact -- not an approximation. Everything downstream of parsing (the global name index, CALLS confidences, INHERITS, entrypoints and reach) is then recomputed from scratch over the full sym…"}, {"id": "sym:repo2graph/graph.py::parse_all", "label": "parse_all", "type": "symbol", "deg": 8, "path": "repo2graph/graph.py", "kind": "function", "lang": "python", "start_line": 340, "end_line": 363, "sig": "def parse_all(files, jobs: int):", "doc": "Read and parse every file, in discovery order, across `jobs` processes. tree-sitter parsing is CPU bound and dominates a large build, so this is the difference between one core and all of them. Order is preserved, which keeps node ids and edge order identical to a serial run."}, {"id": "sym:repo2graph/graph.py::build", "label": "build", "type": "symbol", "deg": 27, "path": "repo2graph/graph.py", "kind": "function", "lang": "python", "start_line": 367, "end_line": 503, "sig": "def build(root: Path, include=None, exclude=None, git_history: int = 0, max_files: int = 0, jobs: int = 0, cache: dict | None = None) -> Graph:", "doc": "Parse `root` into a Graph. Args: root: Repository directory to index. include: Optional glob(s) restricting discovery. exclude: Optional glob(s) removing paths from discovery. git_history: When non-zero, add CO_CHANGE edges from the last N commits. max_files: When positive, index only the first N discovered files. jobs: Parser processes; 0 means one per core, 1 means serial. cache: A previous bui…"}, {"id": "sym:repo2graph/graph.py::mark_entrypoints", "label": "mark_entrypoin…", "type": "symbol", "deg": 9, "path": "repo2graph/graph.py", "kind": "function", "lang": "python", "start_line": 510, "end_line": 535, "sig": "def mark_entrypoints(g: Graph):", "doc": "Flag the call-graph roots: symbols nothing else in the repo calls. Those are the doors into a codebase — CLI commands, request handlers, test bodies, public API — and they are where a reader tracing a flow has to start. A symbol nested inside a function is skipped: an uncalled closure is d     n.y += Math.max(-MAX_STEP, Math.min(MAX_STEP, n.vy));
  }
  alpha *= 0.985;
}

function render() {
  const shownLinks = links.reduce((n, l) => n + (linkShown(l) ? 1 : 0), 0);
  const showLabels = scale >= 0.45 && shownLinks <= 420;
  for (const l of links) {
    const on = linkShown(l);
    l.line.style.display = on ? "" : "none";
    l.text.style.display = on && showLabels ? "" : "none";
    if (!on) continue;
    const a = l.source, b = l.target;
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.hypot(dx, dy) || 0.01;
    const ux = dx / d, uy = dy / d;
    const x1 = a.x + ux * (radius(a) + 2), y1 = a.y + uy * (radius(a) + 2);
    const x2 = b.x - ux * (radius(b) + 7), y2 = b.y - uy * (radius(b) + 7);
    l.line.setAttribute("x1", x1.toFixed(1)); l.line.setAttribute("y1", y1.toFixed(1));
    l.line.setAttribute("x2", x2.toFixed(1)); l.line.setAttribute("y2", y2.toFixed(1));
    if (showLabels) {
      let ang = Math.atan2(dy, dx) * 180 / Math.PI;
      if (ang > 90 || ang < -90) ang += 180;   // labels stay right way up
      l.text.setAttribute("transform",
        "translate(" + ((x1 + x2) / 2).toFixed(1) + "," + ((y1 + y2) / 2).toFixed(1) +
        ") rotate(" + ang.toFixed(1) + ")");
    }
  }
  for (const n of nodes) {
    n.el.style.display = nodeShown(n) ? "" : "none";
    n.el.setAttribute("transform",
      "translate(" + n.x.toFixed(1) + "," + n.y.toFixed(1) + ")");
  }
  view.setAttribute("transform",
    "translate(" + tx.toFixed(1) + "," + ty.toFixed(1) + ") scale(" + scale.toFixed(3) + ")");
}

function frame() {
  step(); render();
  raf = (alpha > 0.02 || drag) ? requestAnimationFrame(frame) : null;
}
function reheat(a) {
  alpha = Math.max(alpha, a === undefined ? 0.6 : a);
  if (!raf) raf = requestAnimationFrame(frame);
}
function fit() {
  const active = nodes.filter(nodeShown);
  if (!active.length) return;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of active) {
    const r = radius(n) + 26;
    x0 = Math.min(x0, n.x - r); y0 = Math.min(y0, n.y - r);
    x1 = Math.max(x1, n.x + r); y1 = Math.max(y1, n.y + r);
  }
  const box = svg.getBoundingClientRect();
  scale = Math.max(0.15, Math.min(box.width / (x1 - x0), box.height / (y1 - y0), 1.6));
  tx = box.width / 2 - ((x0 + x1) / 2) * scale;
  ty = box.height / 2 - ((y0 + y1) / 2) * scale;
  render();
}
// How many settle iterations a relayout may run before it gives up and fits
// whatever it has. Overridable per page with data-max-iterations on #stage, so
// a very large graph can be given a longer settle without a rebuild.
const DEFAULT_MAX_ITERATIONS = 500;
// Iterations per animation frame. The browser gets control back between
// batches, so the page stays responsive and the progress bar actually paints.
const SETTLE_BATCH = 20;

function maxIterations() {
  const raw = parseInt(stage.dataset.maxIterations, 10);
  return (Number.isFinite(raw) && raw > 0) ? raw : DEFAULT_MAX_ITERATIONS;
}

function showProgress(done, total) {
  progress.hidden = false;
  progressBar.style.width = Math.round((done / total) * 100) + "%";
}

function relayout() {
  scatter();
  document.querySelectorAll(".node.pinned").forEach(el => el.classList.remove("pinned"));
  alpha = 1;
  // The settle used to run as one synchronous `while` loop, which blocks the
  // browser's main thread for its whole duration: on a large graph the page is
  // frozen -- no paint, no input, no scroll -- and looks hung. Iteration count
  // was capped to bound that, but a bounded freeze is still a freeze.
  //
  // Now it runs in small batches across animation frames. The thread is handed
  // back between batches, so the layout is visibly converging and the page
  // stays interactive while it does. Cancelling an in-flight settle matters
  // too: two overlapping relayouts would otherwise fight over `alpha`.
  if (settleRaf) cancelAnimationFrame(settleRaf);
  const cap = maxIterations();
  let iters = 0;
  function settle() {
    for (let i = 0; i < SETTLE_BATCH && alpha > 0.02 && iters < cap; i++) {
      step(); iters++;
    }
    showProgress(iters, cap);
    render();
    if (alpha > 0.02 && iters < cap) {
      settleRaf = requestAnimationFrame(settle);
      return;
    }
    settleRaf = null;
    progress.hidden = true;
    fit();
  }
  settleRaf = requestAnimationFrame(settle);
}

// ---------- selection + details ----------
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}
function kv(parent, key, value) {
  if (value === undefined || value === null || value === "") return;
  const row = el("div", "kv");
  row.append(el("span", "", key), el("span", "", String(value)));
  parent.appendChild(row);
}
function emptyDetails() {
  panel.replaceChildren(el("p", "sub", "Click a node to see what it is and what it touches."));
}
function showDetails(n) {
  panel.replaceChildren();
  const chip = el("span", "chip", n.type);
  chip.style.background = colorOf(n);
  panel.append(chip, el("h2", "", n.label));
  const box = el("div");
  kv(box, "id", n.id);
  kv(box, "path", n.path);
  kv(box, "kind", n.kind);
  kv(box, "lang", n.lang);
  kv(box, "lines", n.start_line ? n.start_line + "-" + n.end_line : n.lines);
  kv(box, "degree", n.deg);
  panel.appendChild(box);
  if (n.sig) { panel.append(el("h2", "", "signature"), el("pre", "", n.sig)); }
  if (n.doc) { panel.append(el("h2", "", "doc"), el("pre", "", n.doc)); }

  const list = neighbours(n.id);
  panel.appendChild(el("h2", "", "connections (" + list.length + ")"));
  for (const link of list.slice(0, 80)) {
    const b = el("button", "nb");
    const dot = el("span", "swatch");
    dot.style.background = colorOf(link.other);
    dot.style.display = "inline-block";
    dot.style.marginRight = "6px";
    b.append(dot, document.createTextNode(
      (link.dir === "out" ? "-[" : "<-[") + link.type + (link.dir === "out" ? "]-> " : "]- ") +
      link.other.label));
    b.addEventListener("click", () => selectNode(link.other, true));
    panel.appendChild(b);
  }
}
function selectNode(n, centre) {
  selected = n;
  const near = new Set([n.id]);
  for (const link of neighbours(n.id)) near.add(link.other.id);
  for (const m of nodes) {
    m.el.classList.remove("fade");   // selection dimming replaces search dimming
    m.el.classList.toggle("dim", !near.has(m.id));
  }
  for (const l of links) {
    const on = l.source.id === n.id || l.target.id === n.id;
    l.line.classList.toggle("dim", !on);
    l.text.classList.toggle("dim", !on);
  }
  if (centre) centreOn(n);
  showDetails(n);
}
function clearSelection() {
  selected = null;
  for (const m of nodes) m.el.classList.remove("dim");
  for (const l of links) { l.line.classList.remove("dim"); l.text.classList.remove("dim"); }
  emptyDetails();
}
function centreOn(n) {
  const box = svg.getBoundingClientRect();
  tx = box.width / 2 - n.x * scale;
  ty = box.height / 2 - n.y * scale;
  render();
}

// ---------- controls ----------
function legendRow(host, key, count, colour, kind) {
  const label = el("label");
  const box = el("input");
  box.type = "checkbox";
  box.checked = !(kind === "node" ? hiddenNodeTypes : hiddenEdgeTypes).has(key);
  box.addEventListener("change", () => {
    const hidden = kind === "node" ? hiddenNodeTypes : hiddenEdgeTypes;
    if (box.checked) hidden.delete(key); else hidden.add(key);
    reheat(0.5);
  });
  const mark = el("span", kind === "node" ? "swatch" : "bar");
  if (colour) mark.style.background = colour;
  label.append(box, mark, el("span", "", key), el("span", "count", count));
  host.appendChild(label);
}
for (const [type, count] of DATA.nodeTypes) {
  legendRow(document.getElementById("node-legend"), type, count,
            DATA.colors[type] || DATA.colors._, "node");
}
for (const [type, count] of DATA.edgeTypes) {
  legendRow(document.getElementById("edge-legend"), type, count, null, "edge");
}
document.getElementById("counts").textContent =
  nodes.length + " of " + DATA.totals.nodes + " nodes · " +
  links.length + " of " + DATA.totals.edges + " edges";

const search = document.getElementById("search");
search.addEventListener("input", () => {
  const q = search.value.trim().toLowerCase();
  for (const n of nodes) {
    const hit = q !== "" && n.hay.includes(q);
    n.el.classList.toggle("hit", hit);
    n.el.classList.toggle("fade", q !== "" && !hit);
  }
});
search.addEventListener("keydown", ev => {
  if (ev.key !== "Enter") return;
  const q = search.value.trim().toLowerCase();
  const hit = q && nodes.find(n => nodeShown(n) && n.hay.includes(q));
  if (hit) selectNode(hit, true);
});
document.getElementById("btn-fit").addEventListener("click", fit);
document.getElementById("btn-relayout").addEventListener("click", relayout);
document.getElementById("btn-unpin").addEventListener("click", () => {
  for (const n of nodes) { n.fx = null; n.fy = null; n.el.classList.remove("pinned"); }
  reheat(0.6);
});

// ---------- pointer: drag nodes, pan and zoom the canvas ----------
function toGraph(ev) {
  const box = svg.getBoundingClientRect();
  return [(ev.clientX - box.left - tx) / scale, (ev.clientY - box.top - ty) / scale];
}
function startDrag(ev, n) {
  ev.stopPropagation();
  drag = n;
  n.fx = n.x; n.fy = n.y;
  n.el.classList.add("pinned");
  svg.setPointerCapture(ev.pointerId);
  reheat(0.4);
}
svg.addEventListener("pointerdown", ev => {
  if (ev.target.closest(".node")) return;
  pan = { x: ev.clientX, y: ev.clientY, tx: tx, ty: ty, moved: false };
  svg.classList.add("panning");
  svg.setPointerCapture(ev.pointerId);
});
svg.addEventListener("pointermove", ev => {
  if (drag) {
    const p = toGraph(ev);
    drag.fx = p[0]; drag.fy = p[1];
    reheat(0.3);
  } else if (pan) {
    tx = pan.tx + (ev.clientX - pan.x);
    ty = pan.ty + (ev.clientY - pan.y);
    if (Math.abs(ev.clientX - pan.x) + Math.abs(ev.clientY - pan.y) > 3) pan.moved = true;
    render();
  }
});
svg.addEventListener("pointerup", ev => {
  if (pan && !pan.moved && selected) clearSelection();
  drag = null; pan = null;
  svg.classList.remove("panning");
  try { svg.releasePointerCapture(ev.pointerId); } catch (_) {}
});
svg.addEventListener("pointercancel", ev => {
  drag = null; pan = null;
  svg.classList.remove("panning");
  try { svg.releasePointerCapture(ev.pointerId); } catch (_) {}
});
svg.addEventListener("wheel", ev => {
  ev.preventDefault();
  const box = svg.getBoundingClientRect();
  const mx = ev.clientX - box.left, my = ev.clientY - box.top;
  const next = Math.max(0.12, Math.min(4, scale * Math.exp(-ev.deltaY * 0.0015)));
  tx = mx - (mx - tx) * (next / scale);
  ty = my - (my - ty) * (next / scale);
  scale = next;
  render();
}, { passive: false });
window.addEventListener("resize", render);

emptyDetails();
relayout();
</script>
</body>
</html>
